name: Update Fuel Prices

on:
  schedule:
    # Setiap hari pukul 08:00 WIB (01:00 UTC)
    - cron: '0 1 * * *'
  workflow_dispatch:  # izinkan trigger manual dari tab Actions

jobs:
  update-prices:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: pip install requests beautifulsoup4

      - name: Scrape prices
        run: python scrape_prices.py

      - name: Commit & push if prices changed
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/prices.json
          git diff --staged --quiet \
            || git commit -m "chore: update fuel prices $(date +'%Y-%m-%d')" \
            && git push
